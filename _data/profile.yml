bio: >-
  Hi, I am Jiawei Gu, a PhD student in Computer Science at the University of Washington, advised by
  <a href="https://www.ranjaykrishna.com/" target="_blank">Ranjay Krishna</a>.
  I also work closely with <a href="https://yejinc.github.io/" target="_blank">Yejin Choi</a> and
  <a href="https://limanling.github.io/" target="_blank">Manling Li</a>.
  I study multimodal reasoning: building models that think <em>in</em> modalities, not just <em>with</em> them.
