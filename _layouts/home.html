<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.profile.name }} ({{ site.data.profile.name_zh }})</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.data.profile.name }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <main class="page">
    {% include header.html %}
    {% include news.html %}
    {% include publications.html %}
    {% include talks.html %}
    {% include awards.html %}
    {% include all-publications.html %}
    {% include service.html %}

    <footer class="footer">&copy; {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</footer>
  </main>

  <script src="{{ '/assets/js/talks.js' | relative_url }}" defer></script>
</body>
</html>
